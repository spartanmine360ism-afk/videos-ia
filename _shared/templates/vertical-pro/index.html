<!doctype html>
<html lang="es" data-resolution="portrait" data-category="tips" data-title="" data-palette="auto" data-debate-a="Ajuste original" data-debate-b="Cambio propuesto" data-composition-variables='[{"id":"categoria","type":"string","label":"Categoría del video","default":"tips"},{"id":"titulo","type":"string","label":"Título del video","default":""},{"id":"palette","type":"string","label":"Paleta (auto/tips/fpv/cine/tech)","default":"auto"},{"id":"debate_a","type":"string","label":"Opción A del debate","default":"Ajuste original"},{"id":"debate_b","type":"string","label":"Opción B del debate","default":"Cambio propuesto"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <script src="assets/scripts/palette.js"></script>
    <script src="assets/scripts/gsap.min.js"></script>
    <script src="assets/scripts/TextPlugin.min.js"></script>
  <script>
    window.__HF_WORDS = [];
    fetch('assets/audio/subtitles_timing.json').then(r=>r.ok?r.json():null).then(d=>{ if(d && Array.isArray(d.words)) window.__HF_WORDS=d.words; }).catch(()=>{});
  </script>

    <style>
      :root { --accent:#00e5ff; --accent-2:#f4fbff; --ink:#f4fbff; --ground:#0b111a; --surface:#101a27; --muted:rgba(244,251,255,.62); --hairline:rgba(244,251,255,.12); --font-display:"Outfit",sans-serif; --caption-bg:rgba(0,0,0,.75); --caption-radius:16px; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:var(--ground); font-family:"Inter",sans-serif; }
      #root { position:relative; width:1080px; height:1920px; overflow:hidden; background:var(--ground); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-fps="30" data-width="1080" data-height="1920">
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="6" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="6" data-track-index="1" data-track-kind="captions" data-width="1080" data-height="1920"></div>
      <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="2.2" data-duration="3.8" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <!-- SFX virales (WAV generados por _shared/factory/sfx_generator.py) -->
      <audio id="sfx-drone-beep" class="clip" data-start="0" data-duration="0.32" data-track-index="2" data-volume="0.22" src="assets/audio/sfx/drone_beep.wav"></audio>
      <audio id="sfx-whoosh" class="clip" data-start="0.08" data-duration="0.35" data-track-index="2" data-volume="0.24" src="assets/audio/sfx/whoosh.wav"></audio>
      <audio id="sfx-pop" class="clip" data-start="1.2" data-duration="0.12" data-track-index="2" data-volume="0.24" src="assets/audio/sfx/pop.wav"></audio>
      <audio id="sfx-click-ui" class="clip" data-start="2.6" data-duration="0.05" data-track-index="2" data-volume="0.22" src="assets/audio/sfx/click_ui.wav"></audio>
      <audio id="sfx-error" class="clip" data-start="3.2" data-duration="0.28" data-track-index="2" data-volume="0.2" src="assets/audio/sfx/error_buzz.wav"></audio>
      <audio id="sfx-success" class="clip" data-start="3.55" data-duration="0.45" data-track-index="2" data-volume="0.22" src="assets/audio/sfx/success_chime.wav"></audio>
      <audio id="sfx-riser" class="clip" data-start="4.8" data-duration="0.9" data-track-index="2" data-volume="0.2" src="assets/audio/sfx/riser.wav"></audio>
      <audio id="sfx-bass-hit" class="clip" data-start="5.5" data-duration="0.45" data-track-index="2" data-volume="0.32" src="assets/audio/sfx/bass_hit.wav"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      window.__timelines["main"].seek(0);
    </script>
  </body>
</html>
