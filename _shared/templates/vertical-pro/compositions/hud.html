<template>
  <link rel="stylesheet" href="assets/styles/estilos.css" />
  <style>
    #root { position:absolute; inset:0; overflow:hidden; pointer-events:none; font-family:"Space Grotesk",sans-serif; }
    #hud-telemetry { display:flex; align-items:center; justify-content:space-between; box-sizing:border-box; padding:0 14px; border-radius:10px; background:rgba(0,0,0,.28); color:var(--ink); font-size:20px; font-weight:700; letter-spacing:.1em; line-height:30px; text-transform:uppercase; white-space:nowrap; border:1px solid rgba(244,251,255,.08); }
    #hud-telemetry-dot { display:inline-block; width:8px; height:8px; margin-right:8px; border-radius:50%; background:#ff4d4d; vertical-align:2px; }
    .hud-telemetry-accent { color:var(--accent); }
    .hud-telemetry-muted { color:var(--muted); }
  </style>
  <div id="root" data-composition-id="hud" data-width="1080" data-height="1920" data-duration="6">
    <div id="hud-telemetry" class="clip" data-zone="top" data-start="0" data-duration="6" data-track-index="5" style="position:absolute; left:80px; top:200px; width:770px; height:30px; z-index:10;">
      <span id="hud-telemetry-rec"><span id="hud-telemetry-dot"></span>REC ● 4K/60FPS</span>
      <span id="hud-telemetry-signal" class="hud-telemetry-accent">SEÑAL 98%</span>
      <span id="hud-telemetry-mode" class="hud-telemetry-muted">MODO · CHECK</span>
    </div>
  </div>
  <script>
    var root = document.getElementById("root");
    var duration = parseFloat(root.getAttribute("data-duration") || "6");
    var categoria = (document.documentElement.getAttribute("data-category") || "tips").toLowerCase();
    var modos = { tips:["4K/60FPS","SEÑAL 98%","MODO · CHECK"], fpv:["4K/120FPS","SEÑAL 94%","MODO · MANUAL"], cine:["4K/24FPS","SEÑAL 97%","MODO · CINE"], tech:["4K/60FPS","ENLACE 96%","MODO · REVIEW"] };
    var valores = modos[categoria] || modos.tips;
    document.getElementById("hud-telemetry-rec").lastChild.textContent = " REC ● " + valores[0];
    document.getElementById("hud-telemetry-signal").textContent = valores[1];
    document.getElementById("hud-telemetry-mode").textContent = valores[2];
    var tl = gsap.timeline({ paused: true });
    tl.fromTo("#hud-telemetry", { y: -10, opacity: 0 }, { y: 0, opacity: 0.92, duration: 0.35, ease: "back.out(1.4)" }, 0.05);
    tl.fromTo("#hud-telemetry-dot", { scale: 1 }, { scale: 1.4, duration: 0.18, ease: "back.out(1.5)", yoyo: true, repeat: 1 }, 0.2);
    for (var tiempo = 3.5; tiempo < duration; tiempo += 3.5) {
      tl.fromTo("#hud-telemetry-signal", { opacity: 0.55 }, { opacity: 1, duration: 0.18, ease: "power3.out", yoyo: true, repeat: 1 }, tiempo);
    }
    window.__timelines = window.__timelines || {};
    window.__timelines["hud"] = tl;
  </script>
</template>
